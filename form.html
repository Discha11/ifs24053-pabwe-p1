<!DOCTYPE html>
<html>
<head>
    <title>Form Pendaftaran</title>
</head>
<body>
    <p>
        <a href="index.html">IMDb</a> &nbsp; | &nbsp; 
        <a href="blog.html">Blog</a> &nbsp; | &nbsp; 
        <a href="form.html">Pendaftaran</a> &nbsp; | &nbsp; 
        <a href="cv.html">CV</a>
    </p>
    <hr>

    <fieldset>
        <legend>Daftar Akun</legend>
        <table border="0" width="100%"></table>
            <tr>
                <td>Nama Lengkap:</td>
                <td><input type="text"></td>
            </tr>   
            <tr>
                <td colspan="2"><hr></td>
            </tr>
            <tr>
                <td>Jenis Kelamin:</td>
                <td>
                    <input type="radio" name="jk"> Laki-Laki
                    <input type="radio" name="jk"> Perempuan
                </td>
            </tr>
            <tr>
                <td colspan="2"><hr></td>
            </tr>
        
            <tr>
                <td>Tempat Lahir:</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Tanggal Lahir:</td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td colspan="2"><hr></td>
            </tr>
            <tr>
                <td>Agama:</td>
                <td> 
                    <select>
                        <option>--- Pilih Agama ---</option>
                        <option>Islam</option>
                        <option>Katolik</option>
                        <option>Protestan</option>
                        <option>Hindu</option>
                        <option>Buddha</option>
                        <option>Konghucu</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2"><hr></td>
            </tr>
            <tr>
                <td>Hobi:</td>
                <td>
                    <input type="checkbox"> Olahraga
                    <input type="checkbox"> Membaca
                    <input type="checkbox"> Ngoding
                </td>
            </tr>
            <tr>
                <td colspan="2"><hr></td>
            </tr>
            <tr>
                <td>Password:</td>
                <td><input type="password"></td>
            </tr>

            <tr>
                <td colspan="2"><hr></td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="checkbox"> Dengan mendaftar saya setuju dengan Ketentuan Aplikasi.
                </td>
            </tr>
            <tr>
                <td colspan="2"><hr></td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="reset" value="Reset">
                    <input type="submit" value="Submit">
                </td>
            </tr>
            
        </table>
    </fieldset>
</body>
</html>
