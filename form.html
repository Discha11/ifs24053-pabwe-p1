<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Formulir Pendaftaran Akun Pengguna" />
    <title>Form Pendaftaran Akun</title>
</head>

<body>

    <!-- Navigasi Utama -->
   <nav>
        <a href="index.html">IMDB</a> |
        <a href="blog.html">Dev Blogs</a> |
        <a href="blog-detail.html">Blog Detail</a> |
        <a href="form.html">Register</a> |
        <a href="cv.html">CV</a>
    </nav>

    <main>
        <!-- Form Pendaftaran (h1 dihilangkan untuk menghindari duplikasi judul dengan legend) -->
        <form action="#" method="POST">
            <fieldset>
                <legend>Daftar Akun</legend>

                <p>
                    <label for="nama">Nama Lengkap:</label>
                    <input type="text" id="nama" name="nama" required />
                </p>
                <hr />

                <p>
                    Jenis Kelamin:
                    <label>
                        <input type="radio" name="jenis_kelamin" value="laki-laki" required />
                        Laki-laki
                    </label>
                    <label>
                        <input type="radio" name="jenis_kelamin" value="perempuan" />
                        Perempuan
                    </label>
                </p>
                <hr />

                <p>
                    <label for="tempat_lahir">Tempat Lahir:</label>
                    <input type="text" id="tempat_lahir" name="tempat_lahir" required />
                </p>
                <hr />

                <p>
                    <label for="tanggal_lahir">Tanggal Lahir:</label>
                    <input type="date" id="tanggal_lahir" name="tanggal_lahir" required />
                </p>
                <hr />

                <p>
                    <label for="agama">Agama:</label>
                    <select id="agama" name="agama" required>
                        <option value="">-- Pilih Agama --</option>
                        <option value="Islam">Islam</option>
                        <option value="Katolik">Katolik</option>
                        <option value="Protestan">Protestan</option>
                        <option value="Hindu">Hindu</option>
                        <option value="Buddha">Buddha</option>
                        <option value="Konghucu">Konghucu</option>
                    </select>
                </p>
                <hr />

                <p>
                    Hobi:
                    <label>
                        <input type="checkbox" name="hobi" value="olahraga" />
                        Olahraga
                    </label>
                    <label>
                        <input type="checkbox" name="hobi" value="membaca" />
                        Membaca
                    </label>
                    <label>
                        <input type="checkbox" name="hobi" value="ngoding" />
                        Ngoding
                    </label>
                </p>
                <hr />

                <p>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required />
                </p>
                <hr />

                <p>
                    <label>
                        <input type="checkbox" name="persetujuan" required />
                        Dengan mendaftar saya setuju dengan Ketentuan dan Kebijakan Privasi Aplikasi.
                    </label>
                </p>
                <hr />

                <!-- Tombol Form -->
                <p>
                    <input type="reset" value="Reset" />
                    <input type="submit" value="Submit" />
                </p>
            </fieldset>
        </form>
    </main>

</body>

</html>
