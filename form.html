<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulir Pendaftaran Akun Pengguna">
    <title>Form Pendaftaran Akun</title>
</head>
<body>

    <nav>
        <a href="index.html">IMDb</a> |
        <a href="blog.html">Dev Blogs</a> |
        <a href="form.html">Register</a> |
        <a href="cv.html">CV</a>
    </nav>

    <main>
        <h1>Daftar Akun</h1>

        <form action="#" method="POST">
            <fieldset>
                <legend>Daftar Akun</legend>

                <p>
                    <label for="nama_lengkap">Nama Lengkap:</label>
                    <input type="text" id="nama_lengkap" name="nama_lengkap" required>
                </p>
                <hr>

                <p>
                    Jenis Kelamin:
                    <input type="radio" id="gender_laki" name="jenis_kelamin" value="Laki-Laki" required>
                    <label for="gender_laki">Laki-Laki</label>
                    <input type="radio" id="gender_perempuan" name="jenis_kelamin" value="Perempuan">
                    <label for="gender_perempuan">Perempuan</label>
                </p>
                <hr>

                <p>
                    <label for="tempat_lahir">Tempat Lahir:</label>
                    <input type="text" id="tempat_lahir" name="tempat_lahir" required>
                </p>
                <hr>

                <p>
                    <label for="tanggal_lahir">Tanggal Lahir:</label>
                    <input type="date" id="tanggal_lahir" name="tanggal_lahir" required>
                </p>
                <hr>

                <p>
                    <label for="agama">Agama:</label>
                    <select id="agama" name="agama" required>
                        <option value="">-- Pilih Agama --</option>
                        <option value="Islam">Islam</option>
                        <option value="Katolik">Katolik</option>
                        <option value="Protestan">Protestan</option>
                        <option value="Hindu">Hindu</option>
                        <option value="Buddha">Buddha</option>
                        <option value="Konghucu">Konghucu</option>
                    </select>
                </p>
                <hr>

                <p>
                    Hobi:
                    <input type="checkbox" id="hobi_olahraga" name="hobi" value="Olahraga">
                    <label for="hobi_olahraga">Olahraga</label>
                    <input type="checkbox" id="hobi_membaca" name="hobi" value="Membaca">
                    <label for="hobi_membaca">Membaca</label>
                    <input type="checkbox" id="hobi_ngoding" name="hobi" value="Ngoding">
                    <label for="hobi_ngoding">Ngoding</label>
                </p>
                <hr>

                <p>
                    <label for="kata_sandi">Password:</label>
                    <input type="password" id="kata_sandi" name="kata_sandi" required>
                </p>
                <hr>

                <p>
                    <input type="checkbox" id="persetujuan" name="persetujuan" required>
                    <label for="persetujuan">Dengan mendaftar saya setuju dengan Ketentuan dan Kebijakan Privasi Aplikasi.</label>
                </p>
                <hr>

                <p>
                    <button type="reset">Reset</button>
                    <button type="submit">Submit</button>
                </p>
            </fieldset>
        </form>
    </main>

</body>
</html>
